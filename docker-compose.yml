services:
  tenku:
    build: .
    container_name: tenku
    restart: unless-stopped
    ports:
      # Only localhost — public traffic goes through Caddy/Nginx on 80/443
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/tenku.db
      STORAGE_PATH: /data/storage
      NODE_ENV: production
      # Must match your public URL (also set in .env for compose substitution)
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
    volumes:
      - tenku_data:/data

volumes:
  tenku_data:
