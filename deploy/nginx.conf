# Nginx reverse proxy for Tenku (alternative to Caddy)
# Install certbot separately for HTTPS: certbot --nginx -d tenku.xyz -d www.tenku.xyz

server {
    listen 80;
    listen [::]:80;
    server_name tenku.xyz www.tenku.xyz;

    # Redirect www → apex (optional; certbot may add HTTPS blocks below)
    if ($host = www.tenku.xyz) {
        return 301 https://tenku.xyz$request_uri;
    }

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
